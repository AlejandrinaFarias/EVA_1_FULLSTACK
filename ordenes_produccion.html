<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pan del Sur - Control de Calidad</title>
        <link rel="stylesheet" href="Style.css">
        </head>
        <body>
        <header class="main-header">
            <h1>Pan del Sur</h1>
            <p>Sistema de Control de Producción y Calidad</p>
        </header>
        <nav class="main-nav">
            <ul>
                <li><a href="#">DashBoard</a></li>
                <li><a href="index.html" class="active">Ordenes de Produccion</a></li>
                <li><a href="#">Control de Calidad</a></li>
                <li><a href="#">Lotes/Trazabilidad</a></li>
                <li><a href="#">Productos e Ingredientes</a></li>
                <li><a href="#">Reportes</a></li>
            </ul>
        </nav>
        <main class="container">
            <div class="table-container">
                <section class="dashboard-summary">
                    <h1>Ordenes de Producción</h1>
                    <div class="campo">
                        <label for="nombre">Codigo Producto:</label>
                        <input type="text" id="codigo" name="codigo" required>
                    </div>
                    <div class="campo">
                        <label for="ocasion">Categoria</label>
                        <select id="ocasion" name="categoria" required>
                            <option value="">Selecciona una opción</option>
                            <option value="cumpleanos">Panaderia</option>
                            <option value="matrimonio">Pasteleria</option>
                            <!--Dependiendo de lo que elija, deben salir las opciones-->
                        </select>
                    </div>
                    <div class="campo">
                        <label for="ocasion">Producto</label>
                        <select id="producto" name="producto" required>
                            <option value="">Selecciona una opción</option>
                            <option value="cumpleanos">Pan amasado</option>
                            <option value="matrimonio">Pan de molde</option>
                            <option value="matrimonio">Marraqueta</option>
                            <option value="matrimonio">Hallulla</option>
                            <option value="matrimonio">Pastel de manzana</option>
                            <option value="matrimonio">Queque de vainilla</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="nombre">Cantidad a Producir:</label>
                        <input type="number" id="cantidad" name="cantidad" min="1" max="200" required>
                    </div>
                    <div class="campo">
                        <label for="nombre">Peso por Unidad:</label>
                        <input type="number" id="cantidad" name="cantidad" min="1" max="200" required>
                    </div>
                    <div class="campo">
                        <label for="fecha_produccion">Fecha de Producción: </label>
                        <input type="date" id="fecha_entrega" name="fecha_entrega" required>
                    </div>
                    <div class="campo">
                    <div class="campo">
                        <label for="estado">Estado</label>
                        <select id="estado" name="estado" required>
                            <option value="">Selecciona una opción</option>
                            <option value="Programado">Programado</option>
                            <option value="En_producción">En producción</option>
                            <option value="En_control_calidad">En control de calidad</option>
                            <option value="Conforme">Conforme</option>
                            <option value="No_conforme">No conforme</option>
                            <!--que el estado cambie cuando pasen por las dinstintas fases-->
                        </select>
                    </div>
                    <div class="campo">
                        <label for="prioridad">Prioridad</label>
                        <select id="producto" name="producto" required>
                            <option value="">Selecciona una opción</option>
                            <option value="Alta">Alta</option>
                            <option value="Media">Media</option>
                            <option value="Baja">Baja</option>
                            <!--dependiendo de la fecha, otorgar una prioridad automatica-->
                    </div>
                    
                </section>
            </div>
        </main>
        </body>
</html>
